plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	
	// ModMenu repository
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"visiblearmorslots" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// ModMenu integration (optional at runtime)
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Ensure client resources also expand ${version} in fabric.mod.json when using split source sets
tasks.named("processClientResources") {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// TEMP-DIAGNOSTIC (scratch, will be reverted): generics bounds + mouse accessors
tasks.register("diagnoseMc") {
	doLast {
		def base = new File(projectDir, ".gradle/loom-cache")
		def jars = []
		base.eachFileRecurse { f -> if (f.name.endsWith(".jar") && f.path.contains("minecraft")) jars.add(f) }
		def findClass = { String simple ->
			for (j in jars) {
				def zip = new java.util.zip.ZipFile(j)
				try {
					def en = zip.entries()
					while (en.hasMoreElements()) {
						def n = en.nextElement().name
						if (n.endsWith("/" + simple + ".class") || n == simple + ".class") return [j, n]
					}
				} finally { zip.close() }
			}
			return null
		}
		["ContainerObjectSelectionList", "ObjectSelectionList\$Entry", "AbstractSelectionList\$Entry"].each { simple ->
			def hit = findClass(simple)
			if (hit == null) { println "DIAG_NOFILE $simple"; return }
			def zip = new java.util.zip.ZipFile(hit[0])
			def cr = new org.objectweb.asm.ClassReader(zip.getInputStream(zip.getEntry(hit[1])))
			println "DIAG_SIG $simple :: super=${cr.getSuperName()} signature=${cr.getSignature()}"
			zip.close()
		}
		def hit = findClass("MouseButtonEvent")
		def zip = new java.util.zip.ZipFile(hit[0])
		new org.objectweb.asm.ClassReader(zip.getInputStream(zip.getEntry(hit[1]))).accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
			@Override org.objectweb.asm.MethodVisitor visitMethod(int acc, String mname, String desc, String sig, String[] exc) {
				if (!mname.startsWith('lambda$') && mname != '<clinit>') println "DIAG_M MouseButtonEvent :: $mname $desc"
				return null
			}
		}, org.objectweb.asm.ClassReader.SKIP_CODE | org.objectweb.asm.ClassReader.SKIP_DEBUG)
		zip.close()
		def hit2 = findClass("Identifier")
		def zip2 = new java.util.zip.ZipFile(hit2[0])
		new org.objectweb.asm.ClassReader(zip2.getInputStream(zip2.getEntry(hit2[1]))).accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
			@Override org.objectweb.asm.MethodVisitor visitMethod(int acc, String mname, String desc, String sig, String[] exc) {
				if (mname == 'parse' || mname == 'tryParse' || mname == 'of' || mname == 'fromNamespaceAndPath') println "DIAG_M Identifier :: $mname $desc"
				return null
			}
		}, org.objectweb.asm.ClassReader.SKIP_CODE | org.objectweb.asm.ClassReader.SKIP_DEBUG)
		zip2.close()
	}
}
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	
	// ModMenu repository
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"visiblearmorslots" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// ModMenu integration (optional at runtime)
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Ensure client resources also expand ${version} in fabric.mod.json when using split source sets
tasks.named("processClientResources") {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// TEMP-DIAGNOSTIC (scratch, will be reverted): inspect MC jar contents + method names
tasks.register("diagnoseMc") {
	doLast {
		def mcJar = configurations.compileClasspath.files.find { it.name.contains("minecraft") && it.name.endsWith(".jar") }
		println "DIAG_MC_JAR=" + mcJar
		if (mcJar == null) return
		def zip = new java.util.zip.ZipFile(mcJar)
		["net/minecraft/world/item/ArmorItem.class", "net/minecraft/world/item/ItemStack.class", "net/minecraft/resources/Identifier.class", "net/minecraft/resources/ResourceLocation.class", "net/minecraft/world/entity/EquipmentSlot.class", "net/minecraft/network/RegistryFriendlyByteBuf.class", "net/minecraft/network/FriendlyByteBuf.class", "net/minecraft/network/codec/StreamCodec.class", "net/minecraft/network/protocol/common/custom/CustomPacketPayload.class", "net/minecraft/world/InteractionHand.class", "net/minecraft/server/level/ServerPlayer.class", "net/minecraft/world/inventory/InventoryMenu.class", "net/minecraft/world/inventory/AbstractContainerMenu.class"].each { n ->
			println "DIAG_HAS $n = ${zip.getEntry(n) != null}"
		}
		def all = []
		def e = zip.entries()
		while (e.hasMoreElements()) { all.add(e.nextElement().name) }
		["ArmorItem", "Equippable", "DataComponents", "Prediction", "EquipmentSlot"].each { key ->
			all.findAll { it.contains(key) && it.endsWith(".class") }.take(15).each { println "DIAG_FIND $key -> $it" }
		}
		["net.minecraft.server.level.ServerPlayer", "net.minecraft.world.entity.player.Inventory", "net.minecraft.world.item.ItemStack", "net.minecraft.network.FriendlyByteBuf", "net.minecraft.world.entity.LivingEntity", "net.minecraft.resources.Identifier", "net.minecraft.world.inventory.AbstractContainerMenu"].each { cls ->
			try {
				def out = new ByteArrayOutputStream()
				project.exec { commandLine "javap", "-cp", mcJar.absolutePath, cls; standardOutput = out; ignoreExitValue = true }
				out.toString().readLines().grep(~/drop|getItem|setItem|getStack|setStack|getMaxStackSize|getMaxCount|grow|increment|writeVarInt|readVarInt|getEquipmentSlot|getCarried|setCarried|getItemBySlot|setItemSlot|sendAllDataToRemote|broadcastChanges|slotsChanged|getMainHandItem|getOffhandItem|setItemInHand|fromNamespaceAndPath|getInventory|containerMenu|inventoryMenu|isEmpty|getCount/).take(45).each { println "DIAG_JAVAP $cls :: $it" }
			} catch (Exception ex) { println "DIAG_JAVAP_FAIL $cls $ex" }
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}